# Миграции схемы. На Postgres таблицы создаются ТОЛЬКО отсюда: автосоздание из
# моделей осталось лишь для sqlite-демо и в прод не идёт (см. apps/api/main.py).
[alembic]
script_location = db/migrations
prepend_sys_path = .:packages
version_path_separator = os
path_separator = os
# URL берётся из DIERS_DATABASE_URL в env.py: держать пароль в файле репозитория
# нельзя, а два источника правды разошлись бы молча.
sqlalchemy.url =

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
