# On-prem развёртывание. MUST (Р-23): ФЗ-152 ст. 18 ч. 5 — локализация обязательна.
# Ни один сервис не обращается за пределы контура.
name: diers

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: diers
      POSTGRES_PASSWORD: diers
      POSTGRES_DB: diers
    command: >
      postgres -c max_connections=400 -c shared_buffers=1GB
               -c effective_cache_size=3GB -c work_mem=16MB
               -c jit=off -c random_page_cost=1.1
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U diers"]
      interval: 5s
      retries: 12

  # Пул соединений: при горизонтальном масштабировании API узкое место —
  # не строки, а коннекты. Transaction pooling держит их сотнями, а не тысячами.
  pgbouncer:
    image: edoburu/pgbouncer:latest
    environment:
      DB_HOST: db
      DB_USER: diers
      DB_PASSWORD: diers
      DB_NAME: diers
      POOL_MODE: transaction
      MAX_CLIENT_CONN: "5000"
      DEFAULT_POOL_SIZE: "50"
    depends_on: { db: { condition: service_healthy } }

  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes --maxmemory-policy noeviction
    volumes: [redisdata:/data]

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: diers
      MINIO_ROOT_PASSWORD: diers-secret
    volumes: [miniodata:/data]

  api:
    build: .
    environment:
      DIERS_DATABASE_URL: postgresql+asyncpg://diers:diers@pgbouncer:5432/diers
      DIERS_REDIS_URL: redis://redis:6379/0
      DIERS_S3_ENDPOINT: http://minio:9000
      DIERS_INTENDED_USE: research
      DIERS_CORS_ORIGINS: '["http://localhost:8080"]'
    depends_on:
      pgbouncer: { condition: service_started }
      redis: { condition: service_started }
    ports: ["8000:8000"]
    deploy:
      replicas: 2                    # инстансы без состояния, масштабируются линейно

  worker:
    build: .
    command: ["arq", "apps.worker.tasks.WorkerSettings"]
    environment:
      DIERS_DATABASE_URL: postgresql+asyncpg://diers:diers@pgbouncer:5432/diers
      DIERS_REDIS_URL: redis://redis:6379/0
    depends_on: [redis, pgbouncer]

  web:
    build: ./apps/web
    ports: ["8080:80"]
    depends_on: [api]

volumes: { pgdata: {}, redisdata: {}, miniodata: {} }
