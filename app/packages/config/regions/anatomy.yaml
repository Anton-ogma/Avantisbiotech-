# Анатомическая раскладка «от сустава до стоп» (§14.3 ТЗ).
#
# ВАЖНО: это конфигурация ОТОБРАЖЕНИЯ, и она НЕ входит в input_hash и НЕ имеет
# собственной версии в наборе из пяти (Р-3). Причина: группировка параметров по
# областям тела не меняет ни одного вычисляемого значения — ни z, ни RI, ни
# эффект. Включить её в хэш значило бы объявлять переанализ всех сессий каждый
# раз, когда кто-то переименовал заголовок раздела.
#
# Порядок строк сверху вниз задан §14.3 и менять его произвольно нельзя:
# он воспроизводит логику осмотра, а не удобство вёрстки.
