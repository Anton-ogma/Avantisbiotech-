# Профили беспроводных датчиков ЭМГ (Р-44).
#
# GATT-профиль — ДАННЫЕ, а не код: у каждого производителя свои UUID сервиса и
# характеристик, своя упаковка отсчётов и свой коэффициент к микровольтам.
# Зашить это в код значило бы требовать сборки под каждый новый датчик.
#
# verified: false — профиль описан по документации, но НА ЖЕЛЕЗЕ НЕ ПРОВЕРЕН.
# Такой профиль работает, но каждая запись по нему получает флаг качества
# `ble_profile_unverified`: величина в микровольтах зависит от коэффициента
# `unit_scale_uv`, и ошибка в нём даёт правдоподобные, но неверные амплитуды.
# Снимать флаг можно только после сверки с проводным трактом на том же сигнале.
#
# ЧЕГО В ПРОФИЛЕ НЕТ: имени пациента, серийного номера и любых идентификаторов
# устройства, привязанных к человеку (Р-9). Серийный номер датчика пишется в
# запись как характеристика прибора, а не как ссылка на пациента.
version: "2026.1"
profiles:
  - code: GENERIC_EMG_BLE
    label_ru: "Универсальный ЭМГ по BLE"
    vendor: "—"
    verified: false
    note: >-
      Профиль по образцу типовой реализации: один сервис, одна характеристика
      с уведомлениями, отсчёты little-endian int16. Подходит для датчиков,
      которые отдают сырой АЦП без собственной обёртки.
    service_uuid: "0000fff0-0000-1000-8000-00805f9b34fb"
    data_characteristic: "0000fff1-0000-1000-8000-00805f9b34fb"
    control_characteristic: "0000fff2-0000-1000-8000-00805f9b34fb"
    sample_format: int16_le
    channels_per_packet: 1
    fs_hz: 1000
    unit_scale_uv: 0.1953125      # 3.3 В / 2^14 ≈ 0.2 мкВ на младший разряд
  - code: BLE_HRS_LIKE_4CH
    label_ru: "Четырёхканальный BLE-миограф"
    vendor: "—"
    verified: false
    note: >-
      Четыре канала в одном пакете, отсчёты подряд по каналам. Порядок каналов
      в пакете задаётся channel_order и НЕ угадывается: перестановка каналов
      даёт зеркально неверные стороны, что выглядит как биология.
    service_uuid: "0000ffe0-0000-1000-8000-00805f9b34fb"
    data_characteristic: "0000ffe1-0000-1000-8000-00805f9b34fb"
    sample_format: int16_le
    channels_per_packet: 4
    channel_order: ["CH1", "CH2", "CH3", "CH4"]
    fs_hz: 2000
    unit_scale_uv: 0.1953125
