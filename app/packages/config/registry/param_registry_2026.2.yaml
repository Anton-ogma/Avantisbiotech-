# Реестр параметров (§7 ТЗ). Версионируется: registry_version входит в input_hash
# и в проверку сопоставимости §12 (Р-3).
#
# 2026.2 — приведение к реальным протоколам приборов (Р-36):
#   • SAGITTAL_IMBALANCE_VP_DM: mm → deg (прибор отдаёт «5° A»);
#   • добавлены динамические параметры formetric Dynamic4D (макс. + размах);
#   • добавлена модальность condylography (CADIAX 4), домен condylar.
# Смена версии обязательна: правка единиц и состава меняет результат при тех же
# измерениях, а значит и input_hash, и сопоставимость визитов.
#
# direction: two_sided | higher_worse | lower_worse | unknown
#   unknown — значение ПО УМОЛЧАНИЮ для нового параметра (Р-18). Такой параметр
#   входит в RI по модулю, красится нейтрально, в правила не попадает.
#   Смена на определённое направление требует ссылки на подтверждающий анализ.
