# НОРМ НЕТ — и это штатное состояние (Р-13).
#
# Для новой комбинации оборудования опубликованных норм в нужной стратификации
# не существует, а чужие получены на других популяциях и другой аппаратуре:
# принять их значило бы встроить в результат чужое допущение.
#
# Пока params пуст: z и PI не считаются, колонка нормы — прочерк (§14.2.5),
# RI работает в полном объёме. Отсутствие норм не блокирует ни один сценарий.
#
# Собственные нормы появятся как norms_<version>.yaml с source: own_cohort,
# стратификацией и числом наблюдений (Р-20).
version: "empty"
source: "норм нет; RI не требует норм, PI не вычисляется"
params: {}
