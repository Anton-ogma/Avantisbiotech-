# Реестр проб. Версионируется через sessions.protocol_version, в input_hash не входит:
# на арифметику по собранным каноническим данным не влияет (Р-3).
#
# settle_sec и carryover_min — НАЗНАЧЕННЫЕ значения, подлежащие эмпирической
# калибровке по собственным данным (слой 2 аналитики, §9.8а, Этап 2).
version: "2026.1"
probes:
  - code: MAND_NEUTRAL_NO_APPARATUS
    label_ru: "Нейтраль без аппарата"
    group: reference
    role: reference
    settle_sec: 120
    carryover_min: 0
    modes: [static]
    is_neutral: true
  - code: MAND_NEUTRAL_WITH_APPARATUS
    label_ru: "Нейтраль с аппаратом"
    group: reference
    role: reference
    settle_sec: 120
    carryover_min: 0
    modes: [static]
    is_neutral: true
  - code: MAND_CLENCH
    label_ru: "Сжатие зубов"
    group: mandibular
    role: diagnostic
    settle_sec: 60
    carryover_min: 3
    modes: [static]
    requires_effort: true
