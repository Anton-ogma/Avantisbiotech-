# Проверки на каждый пуш и запрос на слияние. До этого файла в репозитории не
# проверялось НИЧЕГО автоматически: тесты, типы и сборка фронта жили на честном
# слове того, кто локально их запускал.
name: проверки

on:
  push:
    branches: ["**"]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: app/pyproject.toml
      - name: зависимости
        run: pip install -e ".[dev]"
      - name: ruff
        run: ruff check packages apps tools tests
      - name: mypy
        run: mypy
      - name: тесты
        run: PYTHONPATH=packages:. pytest -q
      - name: миграции применяются на чистой базе
        env:
          DIERS_DATABASE_URL: sqlite+aiosqlite:///${{ runner.temp }}/ci.db
        run: PYTHONPATH=packages:. alembic upgrade head

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app/apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: app/apps/web/package-lock.json
      - run: npm ci --no-audit --no-fund
      - name: типы
        run: npx tsc --noEmit
      - name: сборка
        run: npm run build

  images:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Образы собираются на каждой проверке: Dockerfile ломается тише всего —
      # локально всё работает, а в развёртывании не ставится зависимость.
      - name: образ API
        run: docker build -t diers-api:ci app
      - name: образ веб
        run: docker build -t diers-web:ci app/apps/web
      - name: конфигурация compose разбирается
        working-directory: app
        env:
          POSTGRES_PASSWORD: ci-only-not-a-secret
          MINIO_ROOT_PASSWORD: ci-only-not-a-secret
          DIERS_GATEWAY_TOKEN: "0123456789abcdef0123456789abcdef0123456789abcdef"
        run: docker compose config --quiet
