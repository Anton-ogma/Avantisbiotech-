[project]
name = "diers-postural"
version = "1.0.0"
description = "Постуральный модуль DIERS — научно-практическая платформа"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.110", "uvicorn[standard]>=0.29", "pydantic>=2.7", "pydantic-settings>=2.2",
  "sqlalchemy>=2.0", "alembic>=1.13", "asyncpg>=0.29", "pyyaml>=6.0",
  "python-multipart>=0.0.9", "arq>=0.26", "boto3>=1.34",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "httpx>=0.27", "aiosqlite>=0.20", "ruff>=0.5", "mypy>=1.10"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["packages/domain", "packages/contracts"]
