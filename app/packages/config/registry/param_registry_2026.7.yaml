  # ── Myoline: изометрическая сила ───────────────────────────────────────────
  # Р-41: измеряется под пробой и участвует в анализе как ЧЕТВЁРТЫЙ сигнал §9.5.
  # Р-48: состав расширен по печатному отчёту «Comparison Agonist/Antagonist»:
  # девять пар движений по пяти областям, к каждой — сила, процент норматива
  # ПРИБОРА и отношение агониста к антагонисту.
  #
  # in_pi: false и weight: 0.0 — сила сравнивается сама с собой между пробами,
  # складывать ньютоны с миллиметрами в один индекс бессмысленно.
  #
  # direction: unknown — «больше силы лучше» под пробой НЕ установлено: рост
  # усилия при смещённой челюсти может означать и лучшую опору, и
  # компенсаторное перенапряжение (Р-41).

