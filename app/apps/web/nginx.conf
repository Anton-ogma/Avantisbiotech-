server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;

  # Замкнутость контура (Р-23): страница не обращается ни к одному внешнему хосту.
  add_header Content-Security-Policy "default-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'" always;
  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy no-referrer always;

  location /api/ { proxy_pass http://api:8000/; proxy_set_header Host $host; }
  location /assets/ { expires 1y; add_header Cache-Control "public, immutable"; }
  location / { try_files $uri /index.html; }
}
