# Реестр параметров (§7 ТЗ). Версионируется: registry_version входит в input_hash
# и в проверку сопоставимости §12 (Р-3).
#
# 2026.2 — приведение к реальным протоколам приборов (Р-36):
#   • SAGITTAL_IMBALANCE_VP_DM: mm → deg (прибор отдаёт «5° A»);
#   • добавлены динамические параметры formetric Dynamic4D (макс. + размах);
#   • добавлена модальность condylography (CADIAX 4), домен condylar.
# 2026.3 — ЭМГ и myoline (Р-37):
#   • EMG: RMS по каналам, домен muscle, in_pi: false — §9.5 держит мышцу
#     отдельным сигналом, ΔMI не суммируется в постуральный индекс;
#   • myoline (изометрическая сила): в анализе проб НЕ участвует (§9.8 MUST),
#     заведена как ковариата для дозирования и проверки гипотез о модерации.
# 2026.4 — угловой перекос таза (Р-40):
#   • печатный протокол formetric отдаёт «Перекос таза» ДВАЖДЫ и по-разному:
#     в таблице — 17 мм Прав., на иллюстрации того же листа — 9° R. Это не
#     расхождение прибора, а две разные измеряемые величины под одной русской
#     подписью: линейная разность высот DL-DR и угол линии таза к горизонтали.
#   • поэтому заведены отдельные коды PELVIC_OBLIQUITY_ANGLE и
#     DYN_PELVIC_OBLIQUITY_ANGLE (+ размах). Сводить их в один код нельзя ни
#     пересчётом, ни выбором «более точного»: пересчёт требует ширины таза,
#     которую протокол не печатает.
# 2026.5 — myoline становится пробной модальностью (Р-41):
#   • сила измеряется ПОД ПРОБОЙ наравне с формометрией, ЭМГ и кондилографией:
#     в протоколе одноимённые пробы ставятся на всех четырёх приборах;
#   • добавлена MYO_ASYM_TRUNK_LAT — асимметрия боковой силы, по той же формуле
#     200·(R−L)/(|R|+|L|), что асимметрия ЭМГ и мыщелков;
#   • in_pi и weight остаются нулевыми: сила — ЧЕТВЁРТЫЙ отдельный сигнал §9.5,
#     а не слагаемое постурального индекса. Смена версии нужна потому, что
#     меняется единица наблюдения (проба вместо сессии) при тех же кодах.
# 2026.6 — каталог мышц ЭМГ (Р-42):
#   • блок EMG_* порождается из packages/config/emg/muscles.yaml, а не правится
#     руками: коды, области тела и распознавание меток обязаны идти из одного
#     источника. Раньше они жили в трёх местах и расходились;
#   • каталог расширен с 10 мышц до всех поверхностно доступных групп;
#   • прежние 10 кодов сохранены БЕЗ изменений — иначе уже загруженные сессии
#     оказались бы измеренными «не тем».
# 2026.7 — состав myoline по печатному отчёту (Р-48):
#   • девять пар агонист/антагонист по пяти областям: туловище, шея, ноги,
#     предплечье, плечо; отношения агониста к антагонисту;
#   • MYO_PCT_* — процент норматива ПРИБОРА, отдельным семейством кодов: это
#     не наша норма и в индексы не входит.
# Смена версии обязательна: правка единиц и состава меняет результат при тех же
# измерениях, а значит и input_hash, и сопоставимость визитов.
#
# direction: two_sided | higher_worse | lower_worse | unknown
#   unknown — значение ПО УМОЛЧАНИЮ для нового параметра (Р-18). Такой параметр
#   входит в RI по модулю, красится нейтрально, в правила не попадает.
#   Смена на определённое направление требует ссылки на подтверждающий анализ.
